version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: cstopia_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cstopia_secure_password_123
      POSTGRES_DB: cstopia_backend_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 